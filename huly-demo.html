<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Huly-style Team Workspace — Static Evaluation</title>
  <link rel="stylesheet" href="huly-demo.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-orbit" viewBox="0 0 24 24"><path d="M8.2 3.5h4.3v4.3H8.2zM14.1 8.7h6.4V15h-6.4zM3.5 9h6.3v6.3H3.5zM8.9 16.1h6.2v4.4H8.9z"/><path d="M11.8 5.7l4.7 5.7M7 12.2l5 6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9.7 21h4.6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
    <symbol id="i-tracker" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9l2 2 5-5M8 15h8"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v12H9l-5 4z"/></symbol>
    <symbol id="i-drive" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l4 2"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="M21 11.5L12.5 20a6 6 0 0 1-8.5-8.5L13 2.6a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8.2-8.2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3L2.5 20h19zM12 9v4M12 17h.01"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 11.5L21 3l-7 18-2.7-7.3zM11.3 13.7L21 3"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6M5.1 15a8 8 0 0 0 13.2 2M18.9 9A8 8 0 0 0 5.7 7"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.5 2.5 0 1 1 3.3 2.4c-.8.4-1.1.9-1.1 1.6M12 17h.01"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2l1.4 5.6L19 9l-5.6 1.4L12 16l-1.4-5.6L5 9l5.6-1.4zM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7z"/></symbol>
    <symbol id="i-component" viewBox="0 0 24 24"><path d="M12 2l4 3-4 3-4-3zM4 10l4 3-4 3-4-3zM20 10l4 3-4 3-4-3zM12 16l4 3-4 3-4-3z" transform="translate(0 -1) scale(.92) translate(1 1)"/></symbol>
    <symbol id="i-milestone" viewBox="0 0 24 24"><path d="M5 21V4M6 5h11l-2 4 2 4H6"/></symbol>
    <symbol id="i-template" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
  </svg>

  <div class="demo-app" id="demo-app">
    <header class="topbar">
      <div class="topbar-context">
        <button class="topbar-floor" type="button" data-action="go-office">Floor</button>
        <span>Main</span>
        <span class="presence-dot" aria-hidden="true"></span>
        <span class="presence-copy">8 online</span>
      </div>
      <div class="topbar-actions">
        <span class="demo-boundary">Static evaluation · synthetic data</span>
        <button class="icon-button search-trigger" type="button" data-action="global-search" aria-label="Search"><svg><use href="#i-search"></use></svg><span>Search</span><kbd>Ctrl K</kbd></button>
        <button class="icon-button" type="button" data-action="quick-create" aria-label="Create"><svg><use href="#i-plus"></use></svg></button>
        <span class="clock-copy" id="demo-clock">Tue 9:41</span>
      </div>
    </header>

    <div class="workspace-shell">
      <nav class="app-rail" aria-label="Workspace modules">
        <button class="brand-mark" type="button" data-module="office" aria-label="Office"><svg><use href="#i-orbit"></use></svg></button>
        <button class="rail-button" type="button" data-action="toggle-panel" aria-label="Toggle navigation" aria-controls="module-panel" aria-expanded="true"><svg><use href="#i-menu"></use></svg></button>
        <div class="rail-separator"></div>
        <button class="rail-button" type="button" data-module="inbox" aria-label="Inbox"><svg><use href="#i-bell"></use></svg><span class="rail-badge" id="inbox-badge">4</span></button>
        <button class="rail-button" type="button" data-module="planner" aria-label="Planner"><svg><use href="#i-calendar"></use></svg></button>
        <button class="rail-button" type="button" data-module="tracker" aria-label="Tracker"><svg><use href="#i-tracker"></use></svg></button>
        <button class="rail-button" type="button" data-module="documents" aria-label="Documents"><svg><use href="#i-file"></use></svg></button>
        <button class="rail-button" type="button" data-module="chat" aria-label="Chat"><svg><use href="#i-chat"></use></svg></button>
        <button class="rail-button" type="button" data-module="drive" aria-label="Drive"><svg><use href="#i-drive"></use></svg></button>
        <button class="rail-button" type="button" data-module="team" aria-label="Team"><svg><use href="#i-users"></use></svg></button>
        <div class="rail-spacer"></div>
        <button class="rail-button" type="button" data-action="reset-demo" aria-label="Reset demonstration"><svg><use href="#i-reset"></use></svg></button>
        <button class="rail-button" type="button" data-action="show-help" aria-label="Demo help"><svg><use href="#i-help"></use></svg></button>
        <button class="avatar-button" type="button" data-module="team" aria-label="Maya Chen profile"><span>MC</span><i></i></button>
      </nav>

      <aside class="module-panel" id="module-panel" aria-label="Module navigation"></aside>
      <main class="module-content" id="module-content" tabindex="-1"></main>
    </div>
  </div>

  <div class="overlay drawer-overlay" id="drawer-overlay" hidden>
    <button class="overlay-scrim" type="button" data-action="close-drawer" aria-label="Close details"></button>
    <aside class="detail-drawer" id="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
  </div>

  <div class="overlay modal-overlay" id="modal-overlay" hidden>
    <button class="overlay-scrim" type="button" data-action="close-modal" aria-label="Close dialog"></button>
    <section class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="huly-demo.js"></script>
</body>
</html>
